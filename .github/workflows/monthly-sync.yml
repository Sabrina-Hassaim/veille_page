name: Monthly Newsletter Sync

on:
  schedule:
    # 1er de chaque mois à 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Gemini secret
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "Secret GEMINI_API_KEY manquant. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate veille (Gemini + Google Search)
        run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Validate URLs and schema
        run: python sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f data.json "test veille.txt" rapport-veille.md
          if git diff --cached --quiet; then
            echo "[INFO] Aucun nouvel article ou changement détecté."
          else
            echo "[INFO] Commit et push de la veille..."
            git commit -m "chore: mise à jour mensuelle automatique des articles de veille [skip ci]"
            git push
          fi
